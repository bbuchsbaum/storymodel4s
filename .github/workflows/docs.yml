# The documentation site's own gate, run on every push and pull request.
#
# Hand-written; sbt-typelevel manages only ci.yml and clean.yml. `npm run verify` replays the
# thirteen documented programs against the build and byte-compares their transcripts, type-checks
# and builds the site, and runs the layout, navigation, verbatim, figure and provenance courts.
# It has to run somewhere other than the author's machine: it was red for two weeks in September
# 2026 (three drifted transcripts, one example that no longer compiled) and nobody could tell.
#
# grakern is not checked out here on purpose. The build resolves it from the revision pinned in
# build.sbt, so the replay is bound to the pin, not to a checkout that may have drifted from it.

name: Documentation

on:
  pull_request:
    branches: ['**', '!update/**', '!pr/**']
  push:
    branches: ['**', '!update/**', '!pr/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify docs site
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install site dependencies
        working-directory: docs-site
        run: npm ci

      - name: Install the pinned Playwright browser
        working-directory: docs-site
        run: npx playwright install --with-deps chromium

      - name: Verify
        working-directory: docs-site
        run: npm run verify

  upload:
    name: Build Pages artifact
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install site dependencies
        working-directory: docs-site
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        working-directory: docs-site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    name: Deploy Pages
    needs: upload
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
