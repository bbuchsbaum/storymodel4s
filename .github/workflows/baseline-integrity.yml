name: Baseline integrity

on:
  pull_request:
    paths:
      - 'tools/recall-study/**'
      - 'embed-bench/src/main/resources/storymodel4s/bench/sherlock/scene-coding-rule.json'
      - '.github/workflows/baseline-integrity.yml'
  push:
    paths:
      - 'tools/recall-study/**'
      - 'embed-bench/src/main/resources/storymodel4s/bench/sherlock/scene-coding-rule.json'
      - '.github/workflows/baseline-integrity.yml'

permissions:
  contents: read

jobs:
  synthetic-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Synthetic identity and completeness courts (no corpus or model)
        run: python3 tools/recall-study/test_freeze_baseline.py -v
      - name: Guard-deletion witnesses
        run: python3 tools/recall-study/mutate_baseline_checks.py
      - name: Fixed-support scorer and numeric rule oracle (synthetic only)
        run: |
          python3 tools/recall-study/tests/test_gold_scene.py -v
          python3 tools/recall-study/tests/test_gold_rule_single.py
          python3 tools/recall-study/mutate_scorer_checks.py
      - name: Friends sealed test split guard (committed records only, no corpus)
        run: |
          python3 tools/recall-study/tests/test_friends_guard.py -v
          python3 tools/recall-study/tests/mutate_friends_guard.py
