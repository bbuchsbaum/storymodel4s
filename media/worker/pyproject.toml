[project]
name = "storymodel4s-media-worker"
version = "0.1.0"
description = "Untrusted worker for the storymodel4s media court: runs PySceneDetect ContentDetector over frames the JVM adapter identified, returns raw metrics and boundary candidates. Owns no source evidence and never opens a media file."
requires-python = ">=3.13,<3.14"
dependencies = [
  "scenedetect-headless==0.7.1",
  "numpy",
  "opencv-python-headless",
]

[tool.uv]
package = false
